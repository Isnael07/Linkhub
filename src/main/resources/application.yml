spring:
  application:
    name: mylinks

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET}

bucket:
  url: ${BUCKET_URL}
  service-role-key: ${BUCKET_SERVICE_ROLE_KEY}


springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs

